version: 0.2

batch:
  fast-fail: false
  build-fanout:
    parallelism: 10
    ignore-failure: false

phases:
  install:
    commands:
      - echo 'Installing Python dependencies'
      - dnf install -y python3 python3-pip
      - pip3 install --upgrade pip
      - pip3 install pytest

  pre_build:
    commands:
      - echo "Build started on $(date)"
      - echo "Build ID: $CODEBUILD_BUILD_ID"
      - echo "Project Name: $CODEBUILD_PROJECT_NAME"

  build:
    commands:
      - echo 'Running Python Tests'
      - codebuild-tests-run --test-command 'python -m pytest --junitxml=report/test_report.xml' --files-search "codebuild-glob-search 'tests/test_*.py'" --sharding-strategy 'equal-distribution'

  post_build:
    commands:
      - echo "Build completed on $(date)"
      - echo "Build Status: $CODEBUILD_BUILD_SUCCEEDING"
      - echo "Test execution completed"

reports:
  pytest_reports:
    files:
      - "*.xml"
    base-directory: "report"
    file-format: JUNITXML
